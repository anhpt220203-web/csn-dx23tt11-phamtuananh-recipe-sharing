# Demo "Công Thức Việt" — Next.js + Supabase self-hosted, chạy hoàn toàn local.
#
#   1. Copy docker/.env.example thành docker/.env (đã có sẵn key demo, dùng ngay được):
#        cp docker/.env.example docker/.env
#   2. (Quan trọng) Thêm dòng sau vào file hosts để trình duyệt gọi được Supabase local:
#        127.0.0.1 kong
#      Windows: C:\Windows\System32\drivers\etc\hosts
#      macOS/Linux: /etc/hosts
#   3. Build + chạy:
#        docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#   4. Mở http://localhost:3000 để xem demo (đăng nhập admin: phamtuananh@example.com / Demo@123456).
#
# Dừng:    docker compose -f docker/docker-compose.yml down
# Xóa data: docker compose -f docker/docker-compose.yml down -v   (xóa DB demo)

services:
  # ---------- Supabase self-hosted ----------
  db:
    image: supabase/postgres:15.8.1.078
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # Tạo role Supabase (anon/authenticated/service_role/authenticator) lần đầu init DB.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Publish ra host để debug bằng psql/TablePlus (tránh trùng Postgres local).
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: ""
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Tự xác nhận email khi đăng ký (demo local, không cần SMTP thật)
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/confirm
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/confirm
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/confirm
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    restart: unless-stopped

  storage:
    image: supabase/storage-api:v1.22.0
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=storage,public
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage-data:/var/lib/storage
    restart: unless-stopped

  kong:
    image: kong:2.8.1
    depends_on:
      - auth
      - rest
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
    ports:
      # API Gateway: trình duyệt và app đều gọi Supabase qua http://kong:8000
      # (cần thêm "127.0.0.1 kong" vào file hosts của máy host).
      - "8000:8000"
    volumes:
      - ./kong.yml:/var/kong/kong.yml:ro
    restart: unless-stopped

  # ---------- Chạy migrations + seed 1 lần ----------
  # Service one-shot: đợi db/auth/storage sẵn sàng, chạy migrations trong
  # supabase/migrations/, nạp seed.sql và tạo 5 tài khoản demo.
  db-migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db-tools
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ../supabase/seed.sql:/seed/seed.sql:ro
      - ./db-migrate.sh:/db-migrate.sh:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      KONG_URL: http://kong:8000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: ["/bin/bash", "/db-migrate.sh"]
    # Không restart: chạy xong là dừng (compose up vẫn coi là thành công).

  # ---------- Web app ----------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Trình duyệt gọi Supabase qua http://kong:8000 (cần entry "127.0.0.1 kong"
        # trong file hosts). Container web cũng resolve được "kong" qua Docker DNS.
        NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      kong:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
