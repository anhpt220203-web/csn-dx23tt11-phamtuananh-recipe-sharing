# Kong declarative config (DB-less) — API gateway cho Supabase self-hosted.
# Trình duyệt và app gọi Supabase qua http://kong:8000/<path>.
_format_version: "2.1"

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1
        strip_path: true

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1
        strip_path: true

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1
        strip_path: true

plugins:
  # Cho phép web app gọi API từ trình duyệt (3000 = prod compose mặc định,
  # 3005 = web-dev compose khi host bận 3000, 3006 = prod compose WEB_PORT).
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3005
        - http://localhost:3006
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Authorization
        - apikey
        - Content-Type
        - x-client-info
        - prefer
        - range
        - content-range
      exposed_headers:
        - Content-Range
      credentials: true
      max_age: 3600
